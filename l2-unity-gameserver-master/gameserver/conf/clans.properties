#=============================================================
#                          Clans config
#=============================================================
# Number of days you have to wait before joining another clan
DaysBeforeJoinAClan = 1

# Number of days you have to wait before creating a new clan
DaysBeforeCreateAClan = 10

# Number of days it takes to dissolve a clan
DaysToPassToDissolveAClan = 7

# Number of days before joining a new alliance when clan voluntarily leave an alliance
DaysBeforeJoinAllyWhenLeaved = 1

# Number of days before joining a new alliance when clan was dismissed from an alliance
DaysBeforeJoinAllyWhenDismissed = 1

# Number of days before accepting a new clan for alliance when clan was dismissed from an alliance
DaysBeforeAcceptNewClanWhenDismissed = 1

# Number of days before creating a new alliance when dissolved an alliance
DaysBeforeCreateNewAllyWhenDissolved = 10

# Maximum number of clans in ally
MaxNumOfClansInAlly = 3

# Niveau de clan minimum pour poser un blason (3 dans le jeu d'origine)
ClanCrestMinLevel = 0

# Membres et niveau de clan requis pour declarer une guerre (15 et 3 dans le
# jeu d'origine). Abaisses pour pouvoir tester avec un seul joueur par clan.
ClanMembersForWar = 1
ClanWarMinLevel = 0

# Niveau de clan minimum pour utiliser l'entrepot de clan (1 dans le jeu
# d'origine). Abaisse pour pouvoir tester avec un clan tout juste cree.
ClanWarehouseMinLevel = 0

# Niveau de clan minimum pour donner un titre aux membres (3 dans le jeu
# d'origine). Abaisse pour pouvoir tester avec un clan tout juste cree.
ClanTitleMinLevel = 0

# Le chef de clan peut-il diriger lui-meme une garde royale ou une chevalerie ?
# Interdit dans le jeu d'origine ; autorise ici pour tester a deux joueurs.
SubUnitLeaderCanBeClanLeader = True

# Number of days needed by a clan to war back another clan
ClanWarPenaltyWhenEnded = 5

# Privilege browse warehouse enables at the same time also withdraw from warehouse!
MembersCanWithdrawFromClanWH = False

#=============================================================
#                         Manor Config
#=============================================================

# Manor refresh time in hours. Default 8pm (20).
ManorRefreshTime = 20

# Manor refresh time for minutes. Default 0 (start of the hour).
ManorRefreshMin = 0

# Manor next period approve time in hours. Default 6am.
ManorApproveTime = 6

# Manor next period approve time for minutes. Default 0 (start of the hour).
ManorApproveMin = 0

# Manor maintenance time. Default 6 minutes. 
ManorMaintenanceMin = 6

# Manor save period. Default every 2 hours.
ManorSavePeriodRate = 2
# ---------------------------------------------------------------------------
# Crochetage des portes de salle de clan (ajout du projet)
# ---------------------------------------------------------------------------
# Un joueur hors du clan proprietaire peut tenter de forcer une porte fermee.
# Chaque goupille demande un jet de d20 + bonus (dexterite) >= difficulte.
# Difficulte = LockpickBaseDifficulty + LockpickDifficultyPerGrade x categorie de la salle.
# Un 20 naturel reussit toujours ; un 1 naturel brise le crochet et donne l'alarme.
# Chaque echec brise un crochet (objet LockpickItemId), les goupilles deja ouvertes le restent.
LockpickEnabled = True
LockpickItemId = 95100
LockpickPins = 3
LockpickBaseDifficulty = 10
LockpickDifficultyPerGrade = 2

# Porte forcee : ouverte ce nombre de secondes, puis refermee. Ensuite, plus
# aucune tentative sur cette porte pendant LockpickDoorCooldownMinutes.
LockpickDoorOpenSeconds = 45
LockpickDoorCooldownMinutes = 10

# Karma donne au joueur qui force une porte.
LockpickKarma = 720

# Interdit le crochetage quand aucun membre du clan proprietaire n'est connecte.
LockpickRequireOwnerOnline = True
