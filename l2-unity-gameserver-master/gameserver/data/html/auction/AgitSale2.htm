<html><body>
	Le prix de référence de cette salle est de <font color="aaccff">%AGIT_LAST_PRICE%</font> adena.<br>
	À la clôture, vous recevrez la mise gagnante moins la <font color="LEVEL">taxe de transaction (10 %)</font>.<br>
	À quel montant fixez-vous la mise minimale ?
	<table width=270>
		<tr>
			<td width=110><edit var=minbid width=110 type=number></td>
			<td width=160>adena</td>
		</tr>
	</table><br>
	Combien de jours l'enchère doit-elle durer ?<br>
	<combobox width=50 var=day list="7;3;1"><br>
	Présentez la salle en quelques mots. <multiedit var="comment" width=270>
	<img src="L2UI.SquareBlank" width=270 height=10> <img src="L2UI.SquareWhite" width=270 height=1> <img src="L2UI.SquareBlank" width=270 height=5>
	<table width=270>
		<tr>
			<td width=90></td>
			<td width=70 align=center><button action="%AGIT_LINK_BACK%" value="Retour" width=70 height=21 back="L2UI.DefaultButton_click" fore="L2UI.DefaultButton"></td>
			<td width=110 align=center><button action="bypass -h npc_%objectId%_auction $day $minbid" value="Mettre en vente" width=110 height=21 back="L2UI.DefaultButton_click" fore="L2UI.DefaultButton"></td> 
		</tr>
	</table>
</body></html>
