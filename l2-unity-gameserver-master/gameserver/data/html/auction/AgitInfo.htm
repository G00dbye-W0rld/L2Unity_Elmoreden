<html><body>
	<center>Informations sur la salle de clan</center>
	<img src="L2UI.SquareWhite" width=280 height=1> <img src="L2UI.SquareBlank" width=1 height=3>
	<table width=280>
		<tr>
			<td width=100><font color="a2a0a2">Salle de clan :</font></td>
			<td width=180><font color="b09979">%AGIT_NAME%</font></td>
		</tr><tr>
			<td><font color="a2a0a2">Propriétaire :</font></td>
			<td><font color="b09979">%AGIT_OWNER_PLEDGE_NAME%</font></td>
		</tr><tr>
			<td><font color="a2a0a2">Chef de clan :</font></td>
			<td><font color="b09979">%OWNER_PLEDGE_MASTER%</font></td>
		</tr><tr>
			<td><font color="a2a0a2">Capacité :</font></td>
			<td><font color="b09979">%AGIT_SIZE% membres</font></td>
		</tr><tr>
			<td><font color="a2a0a2">Loyer :</font></td>
			<td><font color="b09979">%AGIT_LEASE%</font> adena<font color="LEVEL"> / semaine</font></td>
		</tr><tr>
			<td><font color="a2a0a2">Lieu :</font></td>
			<td>%AGIT_LOCATION%</td>
		</tr>
	</table>
	<img src="L2UI.SquareBlank" width=280 height=10> <img src="L2UI.SquareWhite" width=280 height=1> <img src="L2UI.SquareBlank" width=280 height=5>
	<table width=280>
		<tr>
			<td width=90></td>
			<td width=70 align=center><button action="%AGIT_LINK_BACK%" value="Retour" width=70 height=21 back="L2UI.DefaultButton_click" fore="L2UI.DefaultButton"></td>
			<td width=110 align=center><button action="bypass -h npc_%objectId%_sale" value="Mettre en vente" width=110 height=21 back="L2UI.DefaultButton_click" fore="L2UI.DefaultButton"></td>
		</tr>
	</table>
</body></html>
