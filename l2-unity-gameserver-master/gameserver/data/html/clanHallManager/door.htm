<html><body>
Cette commande ouvre et ferme la porte de la salle de clan.<br>
Porte ouverte, n'importe qui peut entrer, y compris des gens extérieurs au clan. Par prudence, gardez-la fermée le plus souvent possible.<br>
Pour mettre dehors ceux qui ne sont pas du clan, passez par <a action="bypass -h npc_%objectId%_banish_foreigner list">Expulser les intrus</a>.<br>
<center>
<br><button value="Ouvrir" action="bypass -h npc_%objectId%_door open" width=75 height=21 back="L2UI_ch3.Btn1_normalOn" fore="L2UI_ch3.Btn1_normal">
<br><button value="Fermer" action="bypass -h npc_%objectId%_door close" width=75 height=21 back="L2UI_ch3.Btn1_normalOn" fore="L2UI_ch3.Btn1_normal">
<br><button value="Retour" action="bypass -h npc_%objectId%_list_back" width=75 height=21 back="L2UI_ch3.Btn1_normalOn" fore="L2UI_ch3.Btn1_normal">
</center>
</body></html>
