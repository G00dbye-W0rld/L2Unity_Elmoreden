<html><body><br>
<font color="LEVEL">[Gestion de la salle de clan]</font><br>
	<table width=275 cellspacing=3 cellpadding=0>
		<tr>
			<td FIXWIDTH=45><font color="999999">Nom</font></td>
			<td FIXWIDTH=230>%name%</td>
		</tr><tr>
			<td><font color="999999">Coût</font></td>
			<td><font color="00FFFF"><font color="FFAABB">%cost%</td>
		</tr><tr>
			<td valign=top><font color="999999">Effet</font></td>
			<td>%use%</td>
		</tr>
	</table><br>
	Cette installation se paie d'avance.<br>
	Le premier versement est pris dans l'<font color="LEVEL">inventaire du chef de clan</font> ; les suivants sont prélevés sur l'<font color="LEVEL">entrepôt du clan</font>.<br>
	Si l'entrepôt vient à manquer d'adena,<font color="LEVEL"> l'installation est désactivée</font>.<br>
	<center><table width=200>
		<tr>
			<td align=center><button action="bypass -h npc_%objectId%_manage %apply%" value="Valider" width=75 height=21 back="L2UI_ch3.Btn1_normalOn" fore="L2UI_ch3.Btn1_normal"></td>
			<td align=center><button action="bypass -h npc_%objectId%_manage" value="Annuler" width=75 height=21 back="L2UI_ch3.Btn1_normalOn" fore="L2UI_ch3.Btn1_normal"></td>
		</tr>
	</table></center>
</body></html>
