<html><body><br>
<font color="LEVEL">[Coffre du clan]</font><br><br>
Le coffre donne accès à l'entrepôt du clan.<br>
Tout le clan peut y déposer ; seuls les membres qui ont le droit de consulter l'entrepôt peuvent y retirer.<br><br>
<center>
<button value="Déposer" action="bypass -h npc_%objectId%_DepositC" width=120 height=21 back="L2UI_ch3.Btn1_normalOn" fore="L2UI_ch3.Btn1_normal"><br>
<button value="Retirer" action="bypass -h npc_%objectId%_WithdrawC" width=120 height=21 back="L2UI_ch3.Btn1_normalOn" fore="L2UI_ch3.Btn1_normal">
</center>
</body></html>
