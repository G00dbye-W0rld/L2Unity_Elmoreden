<html><body>
Voici les installations de la salle de clan.<br>

<CENTER><br>

<button value="Retour" action="bypass -h npc_%objectId%_list_back" width=75 height=21 back="L2UI_ch3.Btn1_normalOn" fore="L2UI_ch3.Btn1_normal">
